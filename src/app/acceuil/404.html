<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Redirection - Casa Relax</title>
    <script>
        // Redirige immédiatement vers la page d'accueil de l'application
        sessionStorage.redirect = location.pathname;
        window.location.href = '/byomas/';
    </script>
</head>
<body>
    <!-- Message de secours -->
    <noscript>
        <p>Redirection en cours vers l'application...<br>

    </noscript>
</body>
</html>
